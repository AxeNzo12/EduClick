{% extends "base.html" %}

{% block content %}
<section class="pantalla-inicio" style="text-align: center; padding: 40px;">
    <h1 style="font-size: 2.5rem; color: #2E7D32;">¡Bienvenido a EduClick! 🚀</h1>
    <p style="font-size: 1.2rem; color: #555;">Ingresa tu nombre para comenzar a jugar y ganar puntos:</p>

    <form method="POST" action="/" style="max-width: 400px; margin: 30px auto; background-color: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <input type="text" name="nombre" required placeholder="Tu nombre..." style="width: 90%; padding: 15px; font-size: 1.2rem; border-radius: 10px; border: 2px solid #ccc; margin-bottom: 20px; text-align: center;">
        
        <button type="submit" class="btn-opcion" style="width: 100%; background-color: #4CAF50; color: white; padding: 15px; font-size: 1.3rem; border-radius: 10px; border: none; cursor: pointer;">
            ¡Empezar a Aprender! ✨
        </button>
    </form>
</section>
{% endblock %}
