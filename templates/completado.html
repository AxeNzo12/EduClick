{% extends "base.html" %}

{% block content %}
<section style="text-align: center; padding: 40px; background-color: white; border-radius: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto;">
    
    <h1 style="font-size: 5rem; margin-bottom: 10px;">🎉🏆🎉</h1>
    <h2 style="color: #2E7D32; font-size: 2.5rem; margin-bottom: 10px;">¡Felicidades, {{ nombre_usuario }}!</h2>
    <p style="font-size: 1.3rem; color: #555;">Has contestado correctamente todas las actividades de esta materia.</p>
    
    <div style="background-color: #FFF9C4; padding: 15px; border-radius: 15px; border: 3px solid #FBC02D; display: inline-block; margin-top: 20px;">
        <span style="font-size: 1.5rem; font-weight: bold; color: #F57F17;">Tu puntuación total: {{ puntos }} pts 🌟</span>
    </div>

    <div style="margin-top: 40px;">
        <a href="{{ url_for('seleccion_materia', grado_id=grado_id) }}" class="btn-opcion" style="background-color: #1565C0; color: white; padding: 15px 30px; text-decoration: none; border-radius: 10px; font-size: 1.2rem; display: inline-block;">
            ⬅️ Elegir otra Materia
        </a>
    </div>
</section>
{% endblock %}
